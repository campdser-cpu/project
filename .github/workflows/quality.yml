name: Site quality

on:
  push:
    branches: [main, seo-growth-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-slim
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          pnpm config get store-dir

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Typecheck site
        run: pnpm --filter @workspace/morocco-grand-adventure run typecheck

      - name: Build and prerender site
        run: pnpm --filter @workspace/morocco-grand-adventure run build

      - name: Verify required prerendered pages and TopicalLinks output
        run: |
          test -f artifacts/morocco-grand-adventure/dist/en/destinations/merzouga.html
          test -f artifacts/morocco-grand-adventure/dist/en/destinations/marrakech.html
          test -f artifacts/morocco-grand-adventure/dist/en/tours/3-day-sahara-marrakech.html
          test -f artifacts/morocco-grand-adventure/dist/fr/destinations/merzouga.html
          grep -q '/en/destinations/erg-chebbi' artifacts/morocco-grand-adventure/dist/en/destinations/merzouga.html
          grep -q '/en/tours/3-day-sahara-marrakech' artifacts/morocco-grand-adventure/dist/en/destinations/merzouga.html
          grep -q '/en/destinations/marrakech' artifacts/morocco-grand-adventure/dist/en/tours/3-day-sahara-marrakech.html
          grep -q '/fr/destinations/erg-chebbi' artifacts/morocco-grand-adventure/dist/fr/destinations/merzouga.html

      - name: Audit routes and internal links
        run: pnpm --filter @workspace/morocco-grand-adventure run route:audit

      - name: Audit translations
        run: pnpm --filter @workspace/morocco-grand-adventure run i18n:audit
