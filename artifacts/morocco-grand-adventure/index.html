        <!-- Self-hosted Google Fonts: Playfair Display (critical serif family for
         the LCP heading — removed from Google Fonts so the third-party
         stylesheet + cross-origin fetch never delays the hero text render).
         Google Fonts serves one Latin-subset WOFF2 for Playfair Display
         weights 400/500/600/700 (non-italic); we self-host that file for all
         four weights so the serif family renders identically. -->
    <!-- `crossorigin` is REQUIRED on font preloads: fonts are always fetched in
         anonymous CORS mode, so without it the preload lands in a different
         cache partition than the @font-face request and the 38 KB file is
         downloaded twice, wasting the critical path instead of shortening it. -->
    <link rel="preload" as="font" href="/fonts/playfair-display-latin.woff2" type="font/woff2" crossorigin />
    <!-- Playfair Display @font-face (weights 400/500/600/700) is declared in
         src/index.css so index.html carries no inline <style>; this avoids a
         Vite/@tailwindcss inline-CSS proxy race that intermittently broke the
         production HTML build. Rendering is identical. -->

    <!-- Lato (body font) is now self-hosted — the same Lato v25 woff2 files
         Google was serving, declared in src/index.css with Google's own
         unicode-range split. The previous media="print"/onload delivery could
         only apply AFTER load, so the first paint used the generic sans-serif
         and the whole document reflowed when Lato arrived. Preloading the
         latin 400 face (the body default) makes it available at first paint,
         which removes that document-wide shift. -->
    <link rel="preload" as="font" href="/fonts/lato-latin-400.woff2" type="font/woff2" crossorigin />    <link rel="preload" as="image" href="/images/hero/sahara-camel-riders-poster.webp" media="(max-width: 1023px)" fetchpriority="high" />
