<svg width="220" height="64" viewBox="0 0 220 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Luxury Morocco travel logo: gold sun + dune + brand text -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#B8941F"/>
    </linearGradient>
    <linearGradient id="duneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Sun circle -->
  <circle cx="28" cy="26" r="14" fill="url(#goldGrad)"/>
  <!-- Dune wave -->
  <path d="M2 44 Q20 34 40 40 T78 42 T120 38 T160 40 T218 36 L218 52 L2 52 Z" fill="url(#duneGrad)"/>
  <!-- Brand text -->
  <text x="56" y="28" font-family="Playfair Display, Georgia, serif" font-size="18" font-weight="700" fill="#1a3a2a">Morocco</text>
  <text x="56" y="46" font-family="Lato, Arial, sans-serif" font-size="11" font-weight="400" fill="#C9A84C" letter-spacing="2">GRAND ADVENTURE</text>
</svg>